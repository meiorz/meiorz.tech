<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@string/not_found_meta_title</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/term.css">
</head>
<body>
  <a class="skip" href="#main">@string/skip_to_content</a>
  <header class="site-header">
    <a class="wordmark" href="/">@string/wordmark</a>
  </header>
  <main id="main" class="page">
    <section class="block hero" aria-labelledby="h-404">
      <p class="eyebrow">404</p>
      <h1 id="h-404">@string/not_found_title</h1>
      <p class="lede">@string/not_found_body</p>
      <ul>
        <li>@string/not_found_home</li>
        <li>@string/not_found_resume</li>
        <li>@string/not_found_archive</li>
      </ul>
      <p class="hint">@string/not_found_help</p>
    </section>
  </main>
  <footer class="footer">
    <p>@string/footer_note</p>
  </footer>
</body>
</html>
